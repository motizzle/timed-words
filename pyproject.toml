[project]
name = "timed-words"
version = "0.1.0"
description = "When each word is said or sung in a recording"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Tested at both ends: the lowest version of each on Python 3.10, and the newest on Python 3.14.
# torchaudio stops below 2.12, the next untested minor: 2.9 already moved its audio loading to TorchCodec.
dependencies = [
    "numpy>=1.24,<3", "torch>=2.1,<3", "torchaudio>=2.1,<2.12", "transformers>=4.40,<6", "uroman>=1.3.1,<2",
    "faster-whisper>=1.1,<2", "demucs>=4.0.1,<5", "soundfile>=0.12,<1",
    "av<19",  # faster-whisper reads audio with PyAV and passes an option PyAV 19 removed
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["timedwords"]
